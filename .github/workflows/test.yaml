name: Unit and Integration Tests
on: [pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
        channel: 'stable'
      - run: flutter pub get
      - run: flutter test test/unit_tests.dart
      - run: flutter test test/integration_tests.dart